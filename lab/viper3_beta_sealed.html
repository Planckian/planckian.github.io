<style>
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 22px}
  .gatebox{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--line);
    border-radius:18px;padding:34px 32px}
  .gatebox img{height:26px;display:block;margin-bottom:24px}
  .gatebox h1{font-size:26px;margin:0 0 10px}
  .gatebox p{font-size:14px;line-height:1.6;color:var(--dim);margin:0 0 20px}
  .field{display:flex;gap:9px;flex-wrap:wrap}
  input[type=password]{flex:1 1 200px;font:inherit;font-size:15px;background:var(--bg);
    color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;min-height:46px}
  input[type=password]:focus{outline:none;border-color:var(--brand)}
  .gatebox button{font-family:var(--mono);font-size:13px;font-weight:700;background:var(--brand);
    color:#fff;border:1px solid var(--brand);border-radius:10px;padding:12px 20px;cursor:pointer;min-height:46px}
  .gatebox button:disabled{opacity:.5;cursor:default}
  .msg{font-family:var(--mono);font-size:12px;margin-top:16px;min-height:18px}
  .msg.err{color:var(--brand)} .msg.busy{color:var(--dim)}
  .gatebox .back{display:inline-block;margin-top:24px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .gatebox .back:hover{color:var(--dim)}
  noscript{display:block;padding:40px 24px;color:var(--dim);font-size:15px}
</style>

<noscript>This page is encrypted and needs JavaScript to unlock.</noscript>

<div class="gate" id="gate">
  <div class="gatebox">
    <img src="../assets/logo.png" alt="Planckian">
    <h1>Viper</h1>
    <p>
      Unannounced work. The demo is encrypted in the repository and decrypts in your browser —
      nothing is sent anywhere. Same passphrase as the rest of the internal pages.
    </p>
    <form class="field" id="form" autocomplete="off">
      <input type="password" id="pass" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password">
      <button type="submit" id="go">Unlock</button>
    </form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <a class="back" href="../games.html">&#8592; all demos</a>
  </div>
</div>

const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unseal(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    {name:"PBKDF2", salt:b64(SEAL.salt), iterations:SEAL.iterations, hash:"SHA-256"}, base, 512);
  const dk = new Uint8Array(bits);
  const encKey = dk.slice(0,32), macKey = dk.slice(32,64);
  const iv = b64(SEAL.iv), ct = b64(SEAL.ct), tag = b64(SEAL.tag);

  const signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv, 0); signed.set(ct, iv.length);
  const hk = await crypto.subtle.importKey("raw", macKey, {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if (!(await crypto.subtle.verify("HMAC", hk, tag, signed))) throw new Error("wrong passphrase");

  const ak = await crypto.subtle.importKey("raw", encKey, {name:"AES-CBC"}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC", iv}, ak, ct));
}

$("#form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pass = $("#pass").value;
  if (!pass) return;
  const msg = $("#msg"), go = $("#go");
  go.disabled = true; msg.className = "msg busy"; msg.textContent = "deriving key…";
  try {
    const html = await unseal(pass);
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
    // importNode copies <script> elements but the browser will not run them;
    // replacing each with a fresh element makes it execute.
    for (const old of [...document.querySelectorAll("script")]) {
      const s = document.createElement("script");
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = "Wrong passphrase.";
    go.disabled = false;
    $("#pass").select();
  }
});

if (!(window.crypto && crypto.subtle)) {
  $("#msg").className = "msg err";
  $("#msg").textContent = "This browser has no Web Crypto — try a modern browser over https.";
  $("#go").disabled = true;
}
</script>
